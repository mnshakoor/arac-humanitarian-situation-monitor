name: ReliefWeb snapshot sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reliefweb-sync.yml'
      - 'scripts/sync-reliefweb.mjs'
      - 'scripts/cache-reliefweb-thumbnails.mjs'

permissions:
  contents: write

concurrency:
  group: reliefweb-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh ReliefWeb snapshot
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: node scripts/sync-reliefweb.mjs
      - name: Cache ReliefWeb report thumbnails locally
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: node scripts/cache-reliefweb-thumbnails.mjs
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/snapshot.json','utf8')); console.log('snapshot valid')"
      - name: Commit updated snapshot and thumbnails
        run: |
          git config user.name "ARAC Humanitarian Monitor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json assets/report-thumbs
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh ReliefWeb snapshot and thumbnails"
          git push

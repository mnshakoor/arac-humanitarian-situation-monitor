name: ReliefWeb snapshot sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reliefweb-sync.yml'
      - 'scripts/sync-reliefweb.mjs'
      - 'scripts/sync-reliefweb-rss.mjs'
      - 'scripts/cache-reliefweb-thumbnails.mjs'

permissions:
  contents: write

concurrency:
  group: reliefweb-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh ReliefWeb snapshot
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: node scripts/sync-reliefweb.mjs
      - name: Refresh ReliefWeb RSS ticker cache
        run: node scripts/sync-reliefweb-rss.mjs
      - name: Cache ReliefWeb report thumbnails locally
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: node scripts/cache-reliefweb-thumbnails.mjs
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/snapshot.json','utf8')); console.log('snapshot valid')"
          node -e "JSON.parse(require('fs').readFileSync('data/rss.json','utf8')); console.log('rss cache valid')"
      - name: Commit updated snapshot, RSS and thumbnails
        run: |
          set -e
          git config user.name "ARAC Humanitarian Monitor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json data/rss.json assets/report-thumbs
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh ReliefWeb snapshot, RSS and thumbnails"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}: rebasing onto latest main"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "ReliefWeb snapshot, RSS and thumbnails published successfully."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..." >&2
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done

          echo "Failed to publish ReliefWeb data after 3 attempts." >&2
          exit 1

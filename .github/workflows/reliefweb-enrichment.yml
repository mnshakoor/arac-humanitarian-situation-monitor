name: ReliefWeb country enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'

permissions:
  contents: write

concurrency:
  group: reliefweb-country-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enrich highest-volume countries
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: node scripts/enrich-reliefweb.mjs
      - name: Validate enriched snapshot
        run: node -e "const x=JSON.parse(require('fs').readFileSync('data/snapshot.json','utf8')); if(!x.countries||!x.provenance) process.exit(1); console.log('enriched snapshot valid')"
      - name: Commit enriched snapshot
        run: |
          git config user.name "ARAC Humanitarian Monitor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "data: enrich ReliefWeb country profiles"
          git push

name: ReliefWeb country enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'

permissions:
  contents: write

concurrency:
  group: reliefweb-country-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enrich highest-volume countries
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: node scripts/enrich-reliefweb.mjs
      - name: Cache ReliefWeb report thumbnails locally
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: node scripts/cache-reliefweb-thumbnails.mjs
      - name: Validate enriched snapshot
        run: node -e "const x=JSON.parse(require('fs').readFileSync('data/snapshot.json','utf8')); if(!x.countries||!x.provenance) process.exit(1); console.log('enriched snapshot valid')"
      - name: Commit enriched snapshot and thumbnails
        run: |
          set -e
          git config user.name "ARAC Humanitarian Monitor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json assets/report-thumbs
          git diff --cached --quiet && exit 0
          git commit -m "data: enrich ReliefWeb country profiles and thumbnails"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}: rebasing onto latest main"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "ReliefWeb enrichment and thumbnails published successfully."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..." >&2
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done

          echo "Failed to publish ReliefWeb enrichment after 3 attempts." >&2
          exit 1
